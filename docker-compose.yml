services:
  mongodb:
    image: mongo:7
    container_name: footyiq-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  scraper:
    build:
      context: ./scraper
      dockerfile: Dockerfile
    container_name: footyiq-scraper
    environment:
      - SCRAPER_PORT=8001
      - SCRAPER_BASE_URL=https://www.fotmob.com
    ports:
      - "8001:8001"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: footyiq-backend
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/footyiq
      - SCRAPER_BASE_URL=http://scraper:8001
      - JWT_SECRET=super-secret-key-change-in-production
      - UPLOADS_PATH=/app/uploads
    depends_on:
      - mongodb
      - scraper
    ports:
      - "8080:8080"
    volumes:
      - ./uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: footyiq-frontend
    depends_on:
      - backend
    environment:
      - VITE_API_URL=/api
    ports:
      - "5173:5173"

volumes:
  mongo_data:
